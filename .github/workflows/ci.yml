name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pip install poetry
          pip install poetry-plugin-export

      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxrender1 libxext6 xvfb
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        # Include the optional extras so the connector tests exercise the real
        # drivers instead of skipping every one of them.
        run: poetry install --all-extras

      - name: Run linter
        run: poetry run ruff check open_navicat/

      - name: Architecture guard (layering + matrix freshness)
        run: poetry run python scripts/build_dependency_matrix.py --check

      - name: Run tests
        run: poetry run pytest tests/unit/ -v --tb=short

      - name: Security audit
        run: |
          pip install pip-audit
          # --with-markers keeps `python_version < "3.14"` style constraints on
          # the exported lines. Without them pip tries to install a package on an
          # interpreter it cannot support (e.g. backports-asyncio-runner, pinned
          # to 3.10), fails to resolve, and the audit dies instead of reporting.
          poetry export -f requirements.txt --without-hashes --with-markers -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Build package
        run: poetry build

      - name: Verify dist
        run: |
          pip install twine
          twine check dist/*
