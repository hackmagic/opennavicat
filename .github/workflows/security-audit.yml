name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          pip install poetry-plugin-export

      - name: Install dependencies
        run: poetry install

      - name: Run pip-audit
        run: |
          pip install pip-audit
          # poetry-plugin-export already writes the `python_version` markers, so
          # every exported line stays gated on its supported interpreter (e.g.
          # backports-asyncio-runner is 3.10-only). There is no --with-markers
          # flag in the plugin; passing it aborts the step before pip-audit runs.
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --desc

      - name: Run safety check
        run: |
          pip install safety
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt
          safety check -r /tmp/requirements.txt --full-report
        continue-on-error: true

      - name: Install osv-scanner
        # Pinned so the audit cannot change behaviour under us; the SLSA3
        # binary is fetched from the release URL rather than a marketplace
        # action, which keeps it usable from the same script locally.
        env:
          OSV_SCANNER_VERSION: "2.7.0"
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Offline audit (OSV database, no network at scan time)
        # The air-gapped counterpart to pip-audit: same question, but answered
        # against a local database copy so the result is reproducible and no
        # dependency list leaves the runner. scripts/audit_offline.sh explains
        # why it scans the exported requirements set rather than poetry.lock.
        # Non-blocking for now: pip-audit above is the gate, and this proves
        # the offline path keeps working.
        run: bash scripts/audit_offline.sh
        continue-on-error: true
