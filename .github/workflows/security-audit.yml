name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          pip install poetry-plugin-export

      - name: Install dependencies
        run: poetry install

      - name: Run pip-audit
        run: |
          pip install pip-audit
          # poetry-plugin-export already writes the `python_version` markers, so
          # every exported line stays gated on its supported interpreter (e.g.
          # backports-asyncio-runner is 3.10-only). There is no --with-markers
          # flag in the plugin; passing it aborts the step before pip-audit runs.
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --desc

      - name: Run safety check
        run: |
          pip install safety
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt
          safety check -r /tmp/requirements.txt --full-report
        continue-on-error: true
