name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  # The reusable publish workflow pushes a container image; a called workflow
  # can never exceed the caller's permissions, so this must be granted here too.
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxrender1 libxext6 xvfb
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Install dependencies
        # Test with the same dependency set the binaries are built from.
        run: poetry install --all-extras

      - name: Run linter
        run: poetry run ruff check open_navicat/

      - name: Run tests
        run: poetry run pytest tests/unit/ -v

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            cli_artifact: opennavicat-cli-windows-x64.exe
            gui_artifact: opennavicat-windows-x64.exe
          - os: macos-latest
            arch: arm64
            cli_artifact: opennavicat-cli-macos-arm64
            gui_artifact: opennavicat-macos-arm64
          - os: ubuntu-latest
            arch: x64
            cli_artifact: opennavicat-cli-linux-x64
            gui_artifact: opennavicat-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxrender1 libxext6

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        # Every extra, not just the default install: the frozen binaries are the
        # only way most users get OpenNavicat, and an optional driver that is
        # absent from the build surfaces as an unexplainable connect failure.
        run: poetry install --all-extras

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build CLI executable
        run: poetry run pyinstaller --clean opennavicat-cli.spec

      - name: Build GUI executable
        run: poetry run pyinstaller --clean opennavicat-gui.spec

      - name: Rename artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mv dist/opennavicat-cli dist/${{ matrix.cli_artifact }}
          mv dist/opennavicat dist/${{ matrix.gui_artifact }}

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Rename-Item -Path dist/opennavicat-cli.exe -NewName ${{ matrix.cli_artifact }}
          Rename-Item -Path dist/opennavicat.exe -NewName ${{ matrix.gui_artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/${{ matrix.cli_artifact }}

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui_artifact }}
          path: dist/${{ matrix.gui_artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # The assets are stamped "v0.9.1", but a package version must not
          # carry the prefix: `pip install pkg==v0.9.1` is not a valid
          # requirement, and the release notes were publishing exactly that.
          # Strip the `v` for anything that needs a PEP 440 version.
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG=$(git tag -l "v*" --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            CHANGES=$(git log --oneline --no-decorate -20)
          else
            CHANGES=$(git log --oneline --no-decorate ${PREV_TAG}..${TAG})
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenNavicat ${{ steps.tag.outputs.tag }}"
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changes }}

            ## Installation

            This release is distributed as the executables below; download the
            one for your platform. (From source: `pip install open-navicat==${{ steps.tag.outputs.version }}`)

            ## Executables

            Two packages are provided — CLI (lightweight, no Qt) and GUI (full with PySide6):

            | Platform | Architecture | CLI | GUI |
            |----------|-------------|-----|-----|
            | Windows | x64 | `opennavicat-cli-windows-x64.exe` | `opennavicat-windows-x64.exe` |
            | macOS | ARM64 (Apple Silicon) | `opennavicat-cli-macos-arm64` | `opennavicat-macos-arm64` |
            | Linux | x64 | `opennavicat-cli-linux-x64` | `opennavicat-linux-x64` |
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing runs inline rather than as a reusable `workflow_call`.
  #
  # Two things ruled out the alternatives:
  #   * `release: published` never fired, because the Release above is created
  #     with GITHUB_TOKEN and GitHub suppresses runs caused by that token.
  #   * `uses: ./.github/workflows/publish.yml` aborted with a logless
  #     `startup_failure` on both tag push and manual dispatch.
  # Running the jobs here is explicit and observable.
  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    # PYPI_API_TOKEN lives in the environment of the same name; a job only
    # receives an environment's secrets when it declares that environment, so
    # without this the token resolved to empty and every upload failed auth.
    environment: PYPI_API_TOKEN
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker:
    name: Push Docker Image
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # `images` is required: without it the action targets the Docker Hub
          # `library/...` namespace, which this token cannot push to (401).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
